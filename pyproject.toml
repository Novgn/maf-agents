[project]
name = "maf-agents"
version = "0.1.0"
description = "Multi-agent workflow system for Azure detector development using Microsoft Agent Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Microsoft Agent Framework (preview release)
    "agent-framework>=0.1.0a0",  # Installed with --pre flag

    # Azure SDKs
    "azure-kusto-data>=4.0.0",
    "azure-kusto-ingest>=4.0.0",
    "azure-devops>=7.0.0",
    "azure-identity>=1.12.0",
    "azure-keyvault-secrets>=4.6.0",
    "azure-data-tables>=12.0.0",

    # Core dependencies
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=23.2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.9",
    "pyright>=1.1.350",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "poethepoet>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflows", "agents", "shared", "config"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=. --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.poe.tasks]
install = "uv sync --all-extras"
lint = "ruff check ."
format = "ruff format ."
type-check-pyright = "pyright"
type-check-mypy = "mypy ."
type-check = ["type-check-pyright", "type-check-mypy"]
test = "pytest"
test-cov = "pytest --cov=. --cov-report=html --cov-report=term"
pre-commit-install = "pre-commit install"
all-checks = ["lint", "format", "type-check", "test"]
